plugins { 
    id 'com.android.application'
}
android {
    compileSdk = 37
    namespace = 'com.coara.browser'

    defaultConfig {
        minSdk = 24
        targetSdk = 31
        versionCode = 339
        versionName = "4.4.4-4"
        if (project.hasProperty('bundleBuild')) {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        vectorDrawables.useSupportLibrary = true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }
    
    def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_PATH')
    def releaseKeystorePassword = System.getenv('RELEASE_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')

    if (releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            if (releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig = signingConfigs.release
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    splits {
        abi {
            enable = !project.hasProperty('bundleBuild')
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk = false
        }
    }

    lint {
        disable += ['ExpiredTargetSdkVersion', 'NewApi', 'Range', 'SetTextI18n', 'ScopedStorage', 'FieldCanBeLocal', 'GradleDependency']
    }
    packagingOptions {
        excludes += ["DebugProbesKt.bin", "META-INF/*.version", "kotlin-tooling-metadata.json", "**/*.kotlin_builtins"]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.emoji2:emoji2:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
