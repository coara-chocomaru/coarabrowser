name: Build
on:
  push:
    branches:
      - v4.4.4-5
      
  pull_request:
    branches:
      - v4.4.4-5
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          
      - name: chmod +x
        run: chmod +x ./gradlew
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set variables
        run: |
          {
            echo "version=v$(grep versionName app/build.gradle | awk -F\" '{print $2}')"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
            echo "repo=$(echo ${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/})"
            echo "timestamp=$(TZ='Asia/Tokyo' date +'%Y%m%d%H%M%S')"
            echo "name=${repo}-${version}-${commit}-${timestamp}"
          } >> $GITHUB_ENV

      - name: Show set variables
        run: |
          echo "name=${{ env.repo }}-${{ env.version }}-${{ env.commit }}-${{ env.timestamp }}" >> $GITHUB_ENV
          echo -e "version=${{ env.version }}"
          echo -e "commit=${{ env.commit }}"
          echo -e "repo=${{ env.repo }}"
          echo -e "timestamp=${{ env.timestamp }}"

      - name: Build
        run: |
          ./gradlew --no-daemon --stacktrace --warning-mode=all assembleRelease
          mv -vf app/build/outputs/apk/release/app-arm64-v8a-release.apk "${{ env.name }}-arm64-v8a.apk"
          mv -vf app/build/outputs/apk/release/app-armeabi-v7a-release.apk "${{ env.name }}-armeabi-v7a.apk"
          ./gradlew --no-daemon --stacktrace --warning-mode=all -PbundleBuild=true bundleRelease
          mv -vf app/build/outputs/bundle/release/app-release.aab "${{ env.name }}.aab"

      - name: Build APKS
        run: |
          curl -fsSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar bundletool.jar build-apks \
            --bundle="${{ env.name }}.aab" \
            --output="${{ env.name }}.apks" \
            --ks=app/test.jks \
            --ks-pass=pass:test1234 \
            --ks-key-alias=key0 \
            --key-pass=pass:test1234
          rm -f bundletool.jar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.name }}"
          path: |
            ${{ env.name }}-arm64-v8a.apk
            ${{ env.name }}-armeabi-v7a.apk
            ${{ env.name }}.aab
            ${{ env.name }}.apks
